[tox]
requires =
    tox >= 4.4
    pip >= 25.2  # required for python 3.15

envlist =
    coverage-erase
    test-py3{12,15}
    coverage-report
    mypy
    ruff
    typos
    pycodestyle

[testenv]
skip_install = true

[testenv:coverage-erase]
deps =
    coverage

commands =
    coverage erase

[testenv:test-py{3,312,313,314,315}]
# Generate wheel for pytest:
skip_install = false
package = wheel
# Use the same wheel for all environments:
wheel_build_env = build_wheel

deps =
    pytest
    pytest-asyncio
    coverage

depends =
    coverage-erase

commands =
    python -m coverage run -m pytest {posargs}

[testenv:coverage-report]
deps =
    coverage

commands =
    coverage html
    coverage report --fail-under=100

depends =
    test-py312
    test-py315

[testenv:mypy]
deps =
    mypy ~= 2.3.1
    pytest

commands =
    mypy {posargs}

[testenv:ruff]
deps =
    ruff ~= 0.16.4

commands =
    ruff check {posargs}

[testenv:typos]
deps =
    typos ~= 1.49.0

commands =
    typos {posargs}

[testenv:pycodestyle]
deps =
    pycodestyle

commands =
    pycodestyle . {posargs}

[pycodestyle]
# Line length of 88 copied from black.
max-line-length = 88
