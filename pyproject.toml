[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[project]
name = "asyncrunner"
description = "Run asynchronous object in an asynchronized context."
authors = [
    { name = "Udi Fuchs", email = "udifuchs@gmail.com" },
]
requires-python = ">=3.12"
license = "MIT"
license-files = [ "LICENSE" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [ "asyncio", "concurrency" ]
readme = "README.md"
version = "0.1"

[project.urls]
"Homepage" = "http://github.com/udifuchs/asyncrunner"

[tool.setuptools]
py-modules = [ "asyncrunner" ]

[tool.coverage.run]
parallel = true
concurrency = [ "multiprocessing" ]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "case _:\\n\\s*raise AssertionError",
]

[tool.mypy]
files = [ "asyncrunner.py", "test_runner.py" ]
strict = true

[tool.ruff]
exclude = [ "build" ]

[tool.ruff.lint]
select = [ "ALL" ]

ignore = [
    "COM812",  # Trailing comma missing
    "EM101",  # Exception must not use a string literal, assign to variable first
    "EM102",  # Exception must not use an f-string literal, assign to variable first
    "TC006",  # Add quotes to type expression in `typing.cast()`
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"test_runner.py" = [
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D107",  # Missing docstring in __init__
    "PLR2004",  # Magic value used in comparison
    "S101",  # Use of 'assert' detected
    "TC003",  # Move standard library import `...` into a type-checking block
]
